<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>04 Upload Manager Pending</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="screens.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="device-frame">
    <div class="screen upload-manager">
      <div class="um-appbar">
        <div class="um-icon-btn" style="margin-left: 4px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </div>
        <div class="um-appbar-title">Pending uploads</div>

          <div class="um-icon-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
          </div>
      </div>

      <div class="um-body">
        <div class="um-list">

            <div class="um-chip" style="background-color: var(--um-primary-container, #00513E); color: var(--um-on-primary-container, #A4F3D6);">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.16-.28L11.75 4h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z"/></svg>
              <div class="um-chip-text">Connected &middot; uploading automatically</div>
            </div>
            <div style="height: 20px;"></div>
          <div class="um-batch">
            <div class="um-batch-header">
              <div class="um-batch-title">BATCH &middot; just now</div>
              <div class="um-batch-count">0 of 5</div>
              <div class="um-progress-container">
                <div class="um-progress-fill" style="width: 0%;"></div>
              </div>
            </div>
            <div class="um-card">
              <div class="um-row">
                <div class="um-thumb"></div>
                <div class="um-filename">IMG_0031.jpg</div>
                <div class="um-status-icon" style="color: var(--um-primary);">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
                </div>
                <div class="um-status-text" style="color: var(--um-primary);">Uploading</div>
              </div>
              <div class="um-row">
                <div class="um-thumb"></div>
                <div class="um-filename">IMG_0032.jpg</div>
                <div class="um-status-icon" style="color: var(--um-primary);">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
                </div>
                <div class="um-status-text" style="color: var(--um-primary);">Uploading</div>
              </div>
              <div class="um-row">
                <div class="um-thumb"></div>
                <div class="um-filename">IMG_0033.jpg</div>
                <div class="um-status-icon" style="color: var(--um-on-surface-variant);">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                </div>
                <div class="um-status-text" style="color: var(--um-on-surface-variant);">In queue</div>
              </div>
              <div class="um-row">
                <div class="um-thumb"></div>
                <div class="um-filename">IMG_0034.jpg</div>
                <div class="um-status-icon" style="color: var(--um-on-surface-variant);">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                </div>
                <div class="um-status-text" style="color: var(--um-on-surface-variant);">In queue</div>
              </div>
              <div class="um-row">
                <div class="um-thumb"></div>
                <div class="um-filename">IMG_0035.jpg</div>
                <div class="um-status-icon" style="color: var(--um-on-surface-variant);">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                </div>
                <div class="um-status-text" style="color: var(--um-on-surface-variant);">In queue</div>
              </div>
            </div>
          </div>

            <div style="height: 8px;"></div>
            <div class="um-reassurance">Saved on this device. Uploads resume automatically when you're connected.</div>
          <div class="um-btn-container">
            <div class="um-outlined-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
              Start new batch
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
