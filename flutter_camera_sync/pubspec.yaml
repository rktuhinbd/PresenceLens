name: presence_lens_capture
description: >-
  PresenceLens Capture — a custom camera and resilient upload-queue application.
  Task 2 of the Intelligent Machines Senior App Developer technical assessment.
publish_to: 'none'

# versionName 1.0.0, versionCode 1. Bumped only at submission tagging.
version: 1.0.0+1

environment:
  # Local toolchain is Dart 3.13.2 (Flutter 3.47.2 stable). The lower bound is
  # the oldest SDK this code is known to compile against, not the local version,
  # so a reviewer on a slightly older stable Flutter is not locked out.
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management. Mandated by the assessment ("BLoC/Cubit") — GEN-01, FLT-14.
  flutter_bloc: ^9.1.1

  # Value equality for Cubit states, so BlocBuilder can suppress identical
  # rebuilds without a hand-written == / hashCode on every state class.
  equatable: ^2.0.7

  # Camera preview, zoom, focus and capture — FLT-CAM-*. Official flutter.dev
  # plugin; Android SDK 24+, iOS 13+. The app owns the controller lifecycle.
  camera: ^0.12.0+2

  # Durable queue and batch metadata — FLT-DATA-*. Image bytes are NOT stored
  # here; only filesystem paths (ADR-F02).
  sqflite: ^2.4.3

  # Application-owned durable directory for captured images (ADR-F02).
  path_provider: ^2.1.6

  # Path joining that is correct on every platform separator.
  path: ^1.9.1

  # Background worker that drains the queue — named by the assessment itself
  # ("e.g., workmanager") — FLT-SYNC-*.
  workmanager: ^0.10.9

  # ADVISORY connectivity signal only. Link presence is never treated as proof
  # of reachability; the upload attempt is authoritative (ADR-F05).
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Declarative Cubit/Bloc state-transition tests — FLT-TEST-*.
  bloc_test: ^10.0.0

  # Hand-rolled fakes without code generation, so no build_runner step is
  # needed to run the suite.
  mocktail: ^1.0.4

  # Runs the real SQLite engine on the Dart VM, so DAO, transaction and
  # queue-recovery tests execute under `flutter test` on a desktop host with
  # no device attached.
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
